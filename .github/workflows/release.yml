name: Build and publish release assets

on:
  push:
    tags:
      - 'v*'

jobs:
  build_and_release:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build linux/amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-X 'github.com/vorzela/vorzela-migrate/internal/version.CurrentVersion=${{ github.ref_name }}'" -o dist/vm-linux-amd64 main.go

      - name: Build linux/arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags "-X 'github.com/vorzela/vorzela-migrate/internal/version.CurrentVersion=${{ github.ref_name }}'" -o dist/vm-linux-arm64 main.go

      - name: Build darwin/amd64 (optional)
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X 'github.com/vorzela/vorzela-migrate/internal/version.CurrentVersion=${{ github.ref_name }}'" -o dist/vm-macos-amd64 main.go || echo "darwin/amd64 build skipped"

      - name: Build darwin/arm64 (optional)
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X 'github.com/vorzela/vorzela-migrate/internal/version.CurrentVersion=${{ github.ref_name }}'" -o dist/vm-macos-arm64 main.go || echo "darwin/arm64 build skipped"

      - name: Build windows/amd64
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-X 'github.com/vorzela/vorzela-migrate/internal/version.CurrentVersion=${{ github.ref_name }}'" -o dist/vm-windows-amd64.exe main.go

      - name: Build windows/386
        run: |
          GOOS=windows GOARCH=386 go build -ldflags "-X 'github.com/vorzela/vorzela-migrate/internal/version.CurrentVersion=${{ github.ref_name }}'" -o dist/vm-windows-386.exe main.go

      - name: Generate release notes
        id: notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --tags --prune
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG_NAME}$" | head -n1 || true)
          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%an)" -n 50 > notes.txt
          else
            git log --pretty=format:"- %s (%an)" $PREV_TAG..HEAD > notes.txt
          fi

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create GitHub Release (gh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | gh auth login --with-token
          # Create release and upload artifacts using notes.txt
          gh release create "$TAG_NAME" dist/* --title "$TAG_NAME" --notes-file notes.txt --repo "${{ github.repository }}" --prerelease=false
